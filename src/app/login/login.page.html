<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-md="6" offset-md="3">
        <div class="logo ion-text-center">
          <ion-icon name="film-outline" color="primary"></ion-icon>
          <h1>MovieApp</h1>
          <p>
            Build your movie playlist and discover movie lovers who share your
            taste.
          </p>
        </div>

        <ion-card>
          <ion-card-header>
            <ion-card-title>Sign in</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <ion-input
              id="email"
              type="email"
              label="Email"
              label-placement="stacked"
              placeholder="e.g. bart@simpson.com"
            ></ion-input>
            <ion-input
              id="password"
              type="password"
              label="Password"
              label-placement="stacked"
              placeholder="Your password"
            >
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>

            <ion-button id="btn-login" expand="block" class="ion-margin-top">
              <ion-icon name="log-in-outline" slot="start"></ion-icon>
              Sign in
            </ion-button>
          </ion-card-content>
        </ion-card>

        <div class="ion-text-center">
          <ion-button id="btn-register" fill="clear">
            No account yet? Sign up
          </ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
