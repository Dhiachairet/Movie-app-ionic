<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>My playlist</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-md="8" offset-md="2">
        <ion-list id="favorite-list"></ion-list>

        <div class="ion-margin-vertical">
          <strong>Total movies: <span id="total-movies">0</span></strong>
        </div>

        <ion-button href="/matching" router-direction="root" expand="block" fill="outline">
          <ion-icon name="people-outline" slot="start"></ion-icon>
          Find users who share my taste
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
