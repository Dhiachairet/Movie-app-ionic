<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button default-href="/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-md="6" offset-md="3">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Personal information</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <ion-input
              id="first-name"
              type="text"
              label="First name *"
              label-placement="stacked"
            ></ion-input>
            <ion-input
              id="last-name"
              type="text"
              label="Last name *"
              label-placement="stacked"
            ></ion-input>
            <ion-input
              id="age"
              type="number"
              label="Age *"
              label-placement="stacked"
              min="1"
            ></ion-input>
            <ion-input
              id="email"
              type="email"
              label="Email"
              label-placement="stacked"
              readonly="true"
              helper-text="The email is your login, it cannot be changed"
            ></ion-input>
          </ion-card-content>
        </ion-card>

        <ion-card>
          <ion-card-header>
            <ion-card-title>Profile photo</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <div class="photo-preview">
              <img id="photo-preview" />
            </div>

            <ion-button id="btn-photo" expand="block" fill="outline">
              <ion-icon name="camera" slot="start"></ion-icon>
              Change photo
            </ion-button>
          </ion-card-content>
        </ion-card>

        <div class="ion-text-right ion-margin">
          <ion-button id="btn-cancel" color="danger" fill="outline">
            Cancel
            <ion-icon name="close-outline" slot="end"></ion-icon>
          </ion-button>
          <ion-button id="btn-save" color="success" fill="outline">
            <ion-icon name="checkmark-outline" slot="start"></ion-icon>
            Save changes
          </ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
