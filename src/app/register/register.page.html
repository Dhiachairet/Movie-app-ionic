<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button default-href="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Sign up</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-md="6" offset-md="3">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Personal information</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <ion-input
              id="first-name"
              type="text"
              label="First name *"
              label-placement="stacked"
              placeholder="e.g. Bart"
            ></ion-input>
            <ion-input
              id="last-name"
              type="text"
              label="Last name *"
              label-placement="stacked"
              placeholder="e.g. Simpson"
            ></ion-input>
            <ion-input
              id="age"
              type="number"
              label="Age *"
              label-placement="stacked"
              placeholder="e.g. 22"
              min="1"
            ></ion-input>
            <ion-input
              id="email"
              type="email"
              label="Email *"
              label-placement="stacked"
              placeholder="e.g. bart@simpson.com"
            ></ion-input>
            <ion-input
              id="password"
              type="password"
              label="Password *"
              label-placement="stacked"
              placeholder="At least 6 characters"
            >
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </ion-card-content>
        </ion-card>

        <ion-card>
          <ion-card-header>
            <ion-card-title>Profile photo</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <div id="no-photo" class="no-photos">
              <i>No photo added.</i>
            </div>

            <div id="photo-container" class="photo-container">
              <img id="photo-preview" />
              <ion-button
                id="btn-delete-photo"
                fill="clear"
                size="small"
                class="delete-button"
              >
                <ion-icon
                  name="trash-outline"
                  color="danger"
                  slot="icon-only"
                ></ion-icon>
              </ion-button>
            </div>

            <ion-button id="btn-photo" expand="block" fill="outline">
              <ion-icon name="camera" slot="start"></ion-icon>
              <span id="btn-photo-text">Add a photo</span>
            </ion-button>
          </ion-card-content>
        </ion-card>

        <div class="ion-text-right ion-margin">
          <ion-button id="btn-reset" color="danger" fill="outline">
            Reset
            <ion-icon name="close-outline" slot="end"></ion-icon>
          </ion-button>
          <ion-button id="btn-register" color="success" fill="outline">
            <ion-icon name="add-outline" slot="start"></ion-icon>
            Create my account
          </ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
