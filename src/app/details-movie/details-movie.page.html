<ion-header>
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button default-href="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Details</ion-title>
    <ion-buttons slot="end">
      <ion-button id="btn-delete">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-md="6" offset-md="3">
        <div class="ion-margin">
          <strong>Details of this movie:</strong>

          <div class="poster-container">
            <img id="poster" />
          </div>

          <h1 id="title" class="ion-text-center"></h1>
          <div class="ion-text-center">
            <ion-badge id="year" color="medium"></ion-badge>
            <ion-badge id="rating" color="warning"></ion-badge>
          </div>

          <br />
          <strong>Overview:</strong>
          <p id="overview"></p>

          <ion-button id="btn-favorite" expand="block">
            <ion-icon id="icon-favorite" slot="start"></ion-icon>
            <span id="text-favorite"></span>
          </ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
