<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Users</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-md="8" offset-md="2">
        <ion-card color="light">
          <ion-card-content>
            Tap a user to see their favorite movies. A disabled user can no
            longer log in, but their account and playlist are kept (the user is
            not deleted).
          </ion-card-content>
        </ion-card>

        <ion-list id="user-list"></ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
