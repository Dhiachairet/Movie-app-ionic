<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-back-button default-href="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Add movies</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-md="8" offset-md="2">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Starting database</ion-card-title>
            <ion-card-subtitle>
              Import the 20 most popular movies of the moment from TMDB
            </ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-button id="btn-popular" expand="block" fill="outline">
              <ion-icon name="cloud-download-outline" slot="start"></ion-icon>
              Import popular movies
            </ion-button>
          </ion-card-content>
        </ion-card>

        <ion-card>
          <ion-card-header>
            <ion-card-title>Search a movie</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-input
              id="title"
              type="text"
              label="Movie title *"
              label-placement="stacked"
              placeholder="e.g. Inception"
            ></ion-input>
            <ion-button id="btn-search" expand="block" class="ion-margin-top">
              <ion-icon name="search-outline" slot="start"></ion-icon>
              Search
            </ion-button>
          </ion-card-content>
        </ion-card>

        <ion-list id="result-list"></ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
