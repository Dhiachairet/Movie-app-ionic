<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Catalog</ion-title>
    <ion-buttons slot="end">
      <ion-button id="btn-add" href="/add">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar id="search" placeholder="Search a movie"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-md="8" offset-md="2">
        <ion-label><strong>We offer these movies:</strong></ion-label>
        <ion-list id="movie-list"></ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
